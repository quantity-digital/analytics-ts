name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (for example, 1.0.2)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify release version
        shell: bash
        env:
          requested_version: "${{ inputs.version }}"
        run: |
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"

            if [[ "$tag_version" != "$package_version" ]]; then
              echo "Tag version $tag_version does not match package version $package_version"
              exit 1
            fi
          elif [[ "$requested_version" != "$package_version" ]]; then
            echo "Requested version $requested_version does not match package version $package_version"
            exit 1
          fi

      - name: Publish
        run: npm publish
